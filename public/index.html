<!DOCTYPE html>
<html>
<head>
<title>Render Panel</title>
<style>
body{
background:#111;
color:white;
font-family:sans-serif;
text-align:center;
padding:50px;
}
.box{
background:#222;
padding:30px;
border-radius:15px;
}
</style>
</head>
<body>

<div class="box">
<h1>Render Panel</h1>
<p id="status">Checking...</p>
</div>

<script>
fetch("/api/status")
.then(r=>r.json())
.then(d=>{
document.getElementById("status").innerHTML =
"Status: "+d.status;
});
</script>

</body>
</html>
